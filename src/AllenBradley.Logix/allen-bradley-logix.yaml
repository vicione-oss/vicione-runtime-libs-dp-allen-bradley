  # ==================== ARRAY CONTAINER NODES ==========================
  # Per-element access: the array is a container whose children are scalar data points of the element
  # type, one per element the user wants. The container holds the tag name; a child holds the subscript
  # as its tag name, "[3]", so the address composes to "Name[3]". The container declares no element
  # count: the controller does, and a subscript past it is reported at connect.
  # Same element types and the same order as the whole-array nodes above, except BOOL: an element of a
  # BOOL array is a bit inside a word, and writing one is a read-modify-write the port has not proved.

  - Id: SIntArrayContainer
