Common:
  Target: DataPort
  ContentType: Rules
  Version: 1.0
  Date: 2026-08-24
  Description: "Allen-Bradley Logix DataPort - symbolic tag addressing"
  Author: "ifm software gmbh"
  MetadataType: YAML
  Namespace: "ViciOne.DataPort.AllenBradley.Logix"

Root:
  Id: "AllenBradley.Logix"
  Name: "Allen-Bradley Logix"
  Description: "DataPort for Allen-Bradley ControlLogix / CompactLogix controllers over CIP (EtherNet/IP)"
  Icon: allen-bradley-logix
  ChildNodes:
    - Id: DeviceControlLogix5x70
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceControlLogix5x80
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceCompactLogix5x70
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceCompactLogix5x80
      MaxDepth: 64
      MaxInstances: 16

Nodes:

  # ==================== DEVICE ===================================
  # One node id per controller family and generation. The family decides how a request is routed to the CPU, the
  # generation which data types the tree offers.

  - Id: DeviceControlLogix5x70
    Type: DataPortNode
    Name: "ControlLogix 5x70"
    Description: "Allen-Bradley ControlLogix 5550/5560/5570 controller in a 1756 chassis, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: allen-bradley-logix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: &controllogix-device-properties
      - Id: Connection
        Properties:
          - Id: ConnectionEndpoint
            Required: true
          - Id: TcpPort
          - Id: CipRoutePath
            Required: true
          - Id: OperationTimeout
      - Id: QueueConfiguration
        Properties: &queue-properties
          - Id: MaxPendingMessages
          - Id: Strategy
    ChildNodes:
      - Id: ControllerTags5x70
      - Id: ProgramTags5x70

  - Id: DeviceControlLogix5x80
    Type: DataPortNode
    Name: "ControlLogix 5x80"
    Description: "Allen-Bradley ControlLogix 5580 controller in a 1756 chassis, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: allen-bradley-logix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: *controllogix-device-properties
    ChildNodes:
      - Id: ControllerTags5x80
      - Id: ProgramTags5x80

  # No CipRoutePath: a CompactLogix clips onto a DIN rail whose virtual backplane puts the controller
  # at slot 0, so "1,0" is the only answer there is and DeviceNodeMapper supplies it. Asking
  # would be asking a question with one legal answer.

  - Id: DeviceCompactLogix5x70
    Type: DataPortNode
    Name: "CompactLogix 5x70"
    Description: "Allen-Bradley CompactLogix 1769/5370 controller on a DIN rail, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: allen-bradley-logix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: &compactlogix-device-properties
      - Id: Connection
        Properties:
          - Id: ConnectionEndpoint
            Required: true
          - Id: TcpPort
          - Id: OperationTimeout
      - Id: QueueConfiguration
        Properties: *queue-properties
    ChildNodes:
      - Id: ControllerTags5x70
      - Id: ProgramTags5x70

  - Id: DeviceCompactLogix5x80
    Type: DataPortNode
    Name: "CompactLogix 5x80"
    Description: "Allen-Bradley CompactLogix 5380/5480 controller on a DIN rail, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: allen-bradley-logix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: *compactlogix-device-properties
    ChildNodes:
      - Id: ControllerTags5x80
      - Id: ProgramTags5x80

  # ==================== TAG CONTAINERS ===============================
  # Controller scope contributes no segment to a tag address: a controller-scope tag's
  # name is its full symbolic address, so these nodes declare no properties at all. Program
  # scope is the one that prefixes (Program:MainProgram.Tag), and ProgramName is its property.
  #
  # One per generation. Only the child list differs: LREAL is a 5x80 type, and this is what
  # keeps the editor from offering it on a controller that has none. Their MappingIds differ
  # too, so the generation reaches the mapped node and the container can gate its own children
  # by it — one thin ControllerTagsNodeMapper subclass each, over a shared base.

  - Id: ControllerTags5x70
    MappingId: ControllerTags5x70
    Type: DataPortTreeNode
    Name: "Controller"
    Description: "Controller-scope tags of a 5x70 controller. Adds no segment to the tag address."
    Icon: folder
    TransferModes: [ None ]
    ChildNodes:
      - Id: DInt
      - Id: String

  - Id: ControllerTags5x80
    MappingId: ControllerTags5x80
    Type: DataPortTreeNode
    Name: "Controller"
    Description: "Controller-scope tags of a 5x80 controller, which adds LREAL. Adds no segment to the tag address."
    Icon: folder
    TransferModes: [ None ]
    ChildNodes:
      - Id: DInt
      - Id: LReal
      - Id: String

  # Program scope is the one that prefixes: every tag below these nodes addresses as
  # Program:<ProgramName>.<TagName>, composed during the tree walk. A peer of controller scope
  # under the device rather than a child of it, the way Studio 5000's own tree puts them, and
  # uncapped — a controller has as many programs as it has.
  #
  # Split by generation for the reason controller scope is: LREAL is a 5x80 type, and the node
  # type is what keeps the editor from offering it on a controller that has none.

  - Id: ProgramTags5x70
    MappingId: ProgramTags5x70
    Type: DataPortTreeNode
    Name: "Program"
    Description: "Program-scope tags of a 5x70 controller. Adds the Program:<name> segment to every tag address below it."
    Icon: folder
    TransferModes: [ None ]
    PropertyCategories: &program-tags-properties
      - Id: TagScope
        Properties:
          - Id: ProgramName
            Required: true
    ChildNodes:
      - Id: DInt
      - Id: String

  - Id: ProgramTags5x80
    MappingId: ProgramTags5x80
    Type: DataPortTreeNode
    Name: "Program"
    Description: "Program-scope tags of a 5x80 controller, which adds LREAL. Adds the Program:<name> segment to every tag address below it."
    Icon: folder
    TransferModes: [ None ]
    PropertyCategories: *program-tags-properties
    ChildNodes:
      - Id: DInt
      - Id: LReal
      - Id: String

  # ==================== SCALAR NODES ===================================
  #
  # Description schema: docs/Siemens.S7.Documentation/shared/datapoint-description-schema.md
  #   (S7's, adopted verbatim apart from the leading Logix-Type label)
  # Wire-format source: docs/AllenBradley.Documentation/cip-protocol/

  - Id: DInt
    MappingId: DInt
    Type: DataPortTreeNode
    Name: "DInt"
    Description: >-
      Logix-Type: DINT (32-bit signed integer, CIP type code 0xC4)
      Size: 4 bytes
      Encoding: little-endian two's complement
      Layout: byte 0 = LSB, byte 3 = MSB
      Range: −2 147 483 648..2 147 483 647
    Icon: datapoint
    DataTypes: [ Int32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # A 5x80 type. The 5x70 controllers have no LREAL, and the node type they are configured under
  # is what keeps it off their tree.

  - Id: LReal
    MappingId: LReal
    Type: DataPortTreeNode
    Name: "LReal"
    Description: >-
      Logix-Type: LREAL (64-bit IEEE 754 double-precision float, CIP type code 0xCB)
      Size: 8 bytes
      Encoding: IEEE 754 double-precision float, little-endian
      Layout: byte 0 = LSB (low mantissa), byte 7 = MSB (sign + high exponent)
      Bits: 1 sign + 11 exponent + 52 mantissa
      Range: ±2.23e−308..±1.79e+308
    Icon: datapoint
    DataTypes: [ Float64 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # A scalar in the model and a structure on the wire, so it is the one scalar whose size is not fixed
  # by its type: the declared capacity comes with the tag, and MaxLength is what verification holds the
  # controller to.

  - Id: String
    MappingId: String
    Type: DataPortTreeNode
    Name: "String"
    Description: >-
      Logix-Type: STRING (predefined structure, .LEN : DINT + .DATA : SINT[n])
      Size: 4 + n bytes, padded to a 32-bit boundary (88 bytes for the built-in n = 82)
      Encoding: Latin-1, one byte per character; .LEN little-endian two's complement
      Layout: bytes 0..3 = .LEN, bytes 4..(4 + n) = .DATA
      Range: 0..n characters; a longer value is rejected, never truncated
    Icon: datapoint
    DataTypes: [ String ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: MaxLength
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

# ==================== PROPERTY CATEGORIES ===========================

PropertyCategories:

  - Id: Connection
    Name: "Connection"
    Description: "Which controller to reach, and how long one operation against it may take"

  - Id: QueueConfiguration
    Name: "Queue Configuration"
    Description: "How the outgoing write queue behaves when the controller cannot keep up"

  - Id: TagScope
    Name: "Scope"
    Description: "Which part of the controller's tag space these tags live in"

  - Id: TagAddress
    Name: "Tag Address"
    Description: "Studio 5000 tag name"

  - Id: TagDeclaration
    Name: "Tag Declaration"
    Description: "How the tag is declared in Studio 5000, where the type alone does not say"

  - Id: ReadConfiguration
    Name: "Read configuration"
    Description: "Configure properties for reading data points"

# ==================== PROPERTIES ===================================

Properties:

  # ---- TagScope Properties ----
  # The only one there is, and it reaches an address: every tag under the container carrying it
  # is read and written as Program:<this>.<TagName>. Controller scope declares nothing here,
  # because a controller-scope tag's own name is its full address.
  #
  # The two rules below are the editor's half of LogixIdentifier.IsWellFormed, which decides the
  # same names again at mapping time — a program name and a tag name are one rule, so they share
  # one anchor here as they share one class there. It takes two rules because the C# pattern
  # carries its length bound in a lookahead, and a manifest pattern is compiled
  # RegexOptions.NonBacktracking, where there are none. \A and \z rather than ^ and $: in .NET
  # $ also matches before a trailing newline, which would let "Count\n" through.
  - Id: ProgramName
    Name: "Program name"
    Description: "Name of the program as it appears in Studio 5000. Tags below it address as \"Program:MainProgram.Count\"."
    DataType: String
    UiControl: TextBox
    DefaultValue: "MainProgram"
    Validations: &logix-identifier-validations
      - Type: Regex
        Pattern: '\A[A-Za-z_](_?[A-Za-z0-9])*\z'
        Message: "Must start with a letter or an underscore, then letters, digits and single underscores — no two underscores in a row, and none at the end."
      - Type: Regex
        Pattern: '\A.{1,40}\z'
        Message: "Must be 1 to 40 characters long."

  # ---- Connection Properties ----
  # Both carry the non-empty rule LogixCommunicationValidator holds them to, and no more: neither
  # a host name nor a CIP route has a shape this file could decide. A route is not always digits
  # and commas — a hop into another chassis carries the IP of the interface it goes through.
  - Id: ConnectionEndpoint
    Name: "Connection endpoint"
    Description: "IP address or host name of the controller's EtherNet/IP interface"
    DataType: String
    UiControl: TextBox
    DefaultValue: ""
    Validations:
      - Type: Regex
        Pattern: '\A\S+\z'
        Message: "Connection endpoint must be the IP address or host name of the controller."

  # Two fields here and one string on the wire: libplctag has no port attribute and splits "host:port"
  # apart in its native core, so the client layer's GatewayAttribute joins them back up. Asking for
  # an address with a colon in it would push that parsing onto the integrator
  # (docs/AllenBradley.Documentation/libPlcTag/the-port-in-the-gateway-attribute.md).
  - Id: TcpPort
    Name: "TCP port"
    Description: "TCP port the controller's EtherNet/IP interface listens on. 44818 is the registered one; change it only for a NAT rule or a tunnel that moved it"
    DataType: UInt16
    UiControl: NumericUpDown
    DefaultValue: 44818
    MinValue: 1

  # The C# rule is conditional and this one is not, and they still say the same thing: a
  # CompactLogix never reaches this property, because its device nodes do not reference it.
  - Id: CipRoutePath
    Name: "CIP route path"
    Description: "CIP route path from the EtherNet/IP interface to the CPU, one hop per port and address, e.g. \"1,0\" for backplane slot 0"
    DataType: String
    UiControl: TextBox
    DefaultValue: "1,0"
    Validations:
      - Type: Regex
        Pattern: '\A\S+\z'
        Message: "CIP route path must be the sequence of hops to the CPU, e.g. \"1,0\"."

  - Id: OperationTimeout
    Name: "Operation Timeout (ms)"
    Description: "How long one tag read or write against this controller may take before it is aborted"
    DataType: Int32
    UiControl: NumericUpDown
    DefaultValue: 5000
    MinValue: 100

  # ---- QueueConfiguration Properties ----
  # Read by the outgoing port only. An inbound-only device carries the defaults and never
  # builds a queue.
  - Id: MaxPendingMessages
    Name: "Max pending messages"
    Description: "How many write batches may wait for the controller before the strategy below applies"
    DataType: Int32
    UiControl: NumericUpDown
    DefaultValue: 100000
    MinValue: 1

  - Id: Strategy
    Name: "Queue overflow strategy"
    Description: "What a full write queue drops: the oldest batch keeps the freshest value moving, the newest preserves write order"
    DataType: UInt8
    UiControl: NumericListBox
    DefaultValue: 0
    Elements: { 0: 'Drop Oldest', 1: 'Drop Newest' }
    # The bounds are the Enum.IsDefined check LogixCommunicationValidator makes, written the way a
    # manifest can write it: QueueStrategy has these two members and no others.
    MinValue: 0
    MaxValue: 1

  # ---- TagAddress Properties ----
  # The bare name, never an address: scope is composed by the tree walk, so the name rule here is
  # the program container's rule unchanged.
  - Id: TagName
    Name: "Tag name"
    Description: "Studio 5000 tag name (e.g. \"MotorSpeed\")"
    DataType: String
    UiControl: TextBox
    DefaultValue: ""
    Validations: *logix-identifier-validations

  # ---- TagDeclaration Properties ----
  - Id: MaxLength
    Name: "Maximum length (characters)"
    Description: "Character capacity the tag is declared with: 82 for the built-in STRING, 20 for a STRING_20"
    DataType: Int32
    UiControl: NumericUpDown
    DefaultValue: 82
    MinValue: 1

  # ---- ReadConfiguration Properties ----
  - Id: PollFrequency
    Name: "Poll frequency (ms)"
    Description: "Define how often the data point should be read from the controller"
    DataType: Int32
    UiControl: NumericUpDown
    DefaultValue: 500
    MinValue: 100

# ==================== ICONS ========================================
# 'folder' and 'datapoint' are the engine's own icons and are referenced without being
# declared here. The controller glyph is a placeholder until there is real artwork.

Icons:
  - Id: allen-bradley-logix
    Content: 
    ContentType: Base64
