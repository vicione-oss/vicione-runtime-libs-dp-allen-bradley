  # ==================== UDT CONTAINER NODES ============================
  # A UDT tag opened into its members: the container holds the tag name, and each child holds a member
  # name, so the address composes to "Name.Member". A member that is itself a UDT is the same container
  # nested, with the member name as its tag name; an array member opened per element is an array
  # container nested, so the address composes to "Name.Member[3]". The container declares no type: the controller's
  # template says what the members are, and a member that is not there, or not of the configured type,
  # is reported at connect. One per generation, like the scopes, so the child list withholds the
  # 5X80-only types on a 5X70 and the mapped node gates them again. A TIMER and a COUNTER are opened the
  # same way to reach their members; whether CONTROL or an AOI instance is, is not decided.

  - Id: Udt5X70
    MappingId: Udt5X70
    Type: DataPortTreeNode
    Name: "UDT Instance"
    Description: "A tag or a member whose data type is a user-defined data type (UDT), a TIMER or a COUNTER. The UDT itself is declared in Studio 5000, not here. Add a node only for each member you need, in any order, with the member name as its Studio 5000 name. For a member that is itself a UDT, add a UDT Instance below; for per-element access to an array member, add an array container. Nothing checks the values written here: a negative .PRE or .ACC written to a TIMER causes a major fault that stops the controller."
    Icon: udt
    TransferModes: [ None ]
    PropertyCategories: &udt-container-properties
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
    ChildNodes:
      - Id: Bool
      - Id: SInt
      - Id: Int
      - Id: DInt
      - Id: LInt
      - Id: Real
      - Id: String
      - Id: Timer
      - Id: Counter
      - Id: BoolArray
      - Id: SIntArray
      - Id: IntArray
      - Id: DIntArray
      - Id: LIntArray
      - Id: RealArray
      - Id: SIntArrayContainer
      - Id: IntArrayContainer
      - Id: DIntArrayContainer
      - Id: LIntArrayContainer
      - Id: RealArrayContainer
      - Id: Udt5X70

  - Id: Udt5X80
    MappingId: Udt5X80
    Type: DataPortTreeNode
    Name: "UDT Instance"
    Description: "A tag or a member whose data type is a user-defined data type (UDT), a TIMER or a COUNTER. The UDT itself is declared in Studio 5000, not here. Add a node only for each member you need, in any order, with the member name as its Studio 5000 name. For a member that is itself a UDT, add a UDT Instance below; for per-element access to an array member, add an array container. Nothing checks the values written here: a negative .PRE or .ACC written to a TIMER causes a major fault that stops the controller."
