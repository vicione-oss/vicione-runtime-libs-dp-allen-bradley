Common:
  Target: DataPort
  ContentType: Rules
  Version: 1.0
  Date: 2026-08-24
  Description: "Allen-Bradley Logix DataPort - symbolic tag addressing"
  Author: "ifm software gmbh"
  MetadataType: YAML
  Namespace: "ViciOne.DataPort.AllenBradley.Logix"

Root:
  Id: "AllenBradley.Logix"
  Name: "Allen-Bradley Logix"
  Description: "DataPort for Allen-Bradley ControlLogix / CompactLogix controllers over CIP (EtherNet/IP)"
  Icon: allen-bradley-logix
  ChildNodes:
    - Id: DeviceControlLogix5X70
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceControlLogix5X80
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceCompactLogix5X70
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceCompactLogix5X80
      MaxDepth: 64
      MaxInstances: 16

Nodes:

  # ==================== DEVICE ===================================
  # One node id per family and generation: the family decides how a request reaches the CPU, the
  # generation which types the tree offers.

  - Id: DeviceControlLogix5X70
    Type: DataPortNode
    Name: "ControlLogix 5X70"
    Description: "Allen-Bradley ControlLogix 5550/5560/5570 controller in a 1756 chassis, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: allen-bradley-logix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: &controllogix-device-properties
      - Id: Connection
        Properties:
          - Id: ConnectionEndpoint
            Required: true
          - Id: TcpPort
          - Id: CipRoutePath
            Required: true
          - Id: OperationTimeout
      - Id: QueueConfiguration
        Properties: &queue-properties
          - Id: MaxPendingMessages
          - Id: Strategy
    ChildNodes:
      - Id: ControllerTags5X70
      - Id: ProgramTags5X70

  - Id: DeviceControlLogix5X80
    Type: DataPortNode
    Name: "ControlLogix 5X80"
    Description: "Allen-Bradley ControlLogix 5580 controller in a 1756 chassis, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: allen-bradley-logix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: *controllogix-device-properties
    ChildNodes:
      - Id: ControllerTags5X80
      - Id: ProgramTags5X80

  # No CipRoutePath: a CompactLogix's virtual backplane puts the controller at slot 0, so "1,0" is
  # the only legal answer and DeviceNodeMapper supplies it rather than asking for it.

  - Id: DeviceCompactLogix5X70
    Type: DataPortNode
    Name: "CompactLogix 5X70"
    Description: "Allen-Bradley CompactLogix 1769/5370 controller on a DIN rail, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: allen-bradley-logix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: &compactlogix-device-properties
      - Id: Connection
        Properties:
          - Id: ConnectionEndpoint
            Required: true
          - Id: TcpPort
          - Id: OperationTimeout
      - Id: QueueConfiguration
        Properties: *queue-properties
    ChildNodes:
      - Id: ControllerTags5X70
      - Id: ProgramTags5X70

  - Id: DeviceCompactLogix5X80
    Type: DataPortNode
    Name: "CompactLogix 5X80"
    Description: "Allen-Bradley CompactLogix 5380/5480 controller on a DIN rail, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: allen-bradley-logix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: *compactlogix-device-properties
    ChildNodes:
      - Id: ControllerTags5X80
      - Id: ProgramTags5X80

  # ==================== TAG CONTAINERS ===============================
  # One per scope and generation, differing only in the child list. Withholding the 5X80 group is
  # the whole of what keeps the editor from offering a 5X80-only type on a controller that has not
  # got it; the MappingIds differ so the generation reaches the mapped node, which gates the same
  # types again for a configuration the editor did not build.

  - Id: ControllerTags5X70
    MappingId: ControllerTags5X70
    Type: DataPortTreeNode
    Name: "Controller"
    Description: "Controller-scope tags of a 5X70 controller. Adds no segment to the tag address."
    Icon: folder
    TransferModes: [ None ]
    ChildNodes: &basic-tag-nodes
      # Grouped by type family, widest last within a family, and in the order the tag node
      # definitions below are written.
      - Id: Bool
      # Signed integers
      - Id: SInt
      - Id: Int
      - Id: DInt
      - Id: LInt
      # Floating point
      - Id: Real
      # String
      - Id: String
      # Arrays — grouped by shape rather than by element type, because that is what they have in common
      - Id: BoolArray
      - Id: SIntArray
      - Id: IntArray
      - Id: DIntArray
      - Id: LIntArray
      - Id: RealArray

  - Id: ControllerTags5X80
    MappingId: ControllerTags5X80
    Type: DataPortTreeNode
    Name: "Controller"
    Description: "Controller-scope tags of a 5X80 controller, which adds the unsigned integers and LREAL. Adds no segment to the tag address."
    Icon: folder
    TransferModes: [ None ]
    ChildNodes: &logix5x80-tag-nodes
      # *basic-tag-nodes spelled out again: YAML merges mappings, not sequences. Same grouping,
      # with each 5X80-only type in the family it belongs to rather than in a block of its own.
      - Id: Bool
      # Signed integers
      - Id: SInt
      - Id: Int
      - Id: DInt
      - Id: LInt
      # Unsigned integers — 5X80 only
      - Id: USInt
      - Id: UInt
      - Id: UDInt
      - Id: ULInt
      # Floating point — LREAL is 5X80 only
      - Id: Real
      - Id: LReal
      # String
      - Id: String
      # Arrays
      - Id: BoolArray
      - Id: SIntArray
      - Id: IntArray
      - Id: DIntArray
      - Id: LIntArray
      # Unsigned integer arrays — 5X80 only
      - Id: USIntArray
      - Id: UIntArray
      - Id: UDIntArray
      - Id: ULIntArray
      - Id: RealArray
      # LREAL array — 5X80 only
      - Id: LRealArray

  # A peer of controller scope under the device rather than a child of it, the way Studio 5000's own
  # tree puts them, and uncapped — a controller has as many programs as it has.

  - Id: ProgramTags5X70
    MappingId: ProgramTags5X70
    Type: DataPortTreeNode
    Name: "Program"
    Description: "Program-scope tags of a 5X70 controller. Adds the Program:<name> segment to every tag address below it."
    Icon: folder
    TransferModes: [ None ]
    PropertyCategories: &program-tags-properties
      - Id: TagScope
        Properties:
          - Id: ProgramName
            Required: true
    ChildNodes: *basic-tag-nodes

  - Id: ProgramTags5X80
    MappingId: ProgramTags5X80
    Type: DataPortTreeNode
    Name: "Program"
    Description: "Program-scope tags of a 5X80 controller, which adds the unsigned integers and LREAL. Adds the Program:<name> segment to every tag address below it."
    Icon: folder
    TransferModes: [ None ]
    PropertyCategories: *program-tags-properties
    ChildNodes: *logix5x80-tag-nodes

  # ==================== TAG NODES ======================================
  # Grouped by type family and widening within a family, in the order the child lists above name
  # them. A 5X80-only type sits in its family rather than in a block of its own; what withholds it
  # from a 5X70 is the child list, not the position here.

  # ---- Bool ----
  - Id: Bool
    MappingId: Bool
    Type: DataPortTreeNode
    Name: "Bool"
    Description: >-
      Logix-Type: BOOL (single-byte boolean, CIP type code 0xC1)
      Size: 1 byte
      Encoding: nonzero is true; a written true is 0xFF
      Layout: byte 0 = the whole value
      Range: false, true
    Icon: datapoint
    DataTypes: [ Bool ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Signed integers ----
  - Id: SInt
    MappingId: SInt
    Type: DataPortTreeNode
    Name: "SInt"
    Description: >-
      Logix-Type: SINT (8-bit signed integer, CIP type code 0xC2)
      Size: 1 byte
      Encoding: two's complement; a single byte has no byte order
      Layout: byte 0 = the whole value
      Range: −128..127
    Icon: datapoint
    DataTypes: [ Int8 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: Int
    MappingId: Int
    Type: DataPortTreeNode
    Name: "Int"
    Description: >-
      Logix-Type: INT (16-bit signed integer, CIP type code 0xC3)
      Size: 2 bytes
      Encoding: little-endian two's complement
      Layout: byte 0 = LSB, byte 1 = MSB
      Range: −32 768..32 767
    Icon: datapoint
    DataTypes: [ Int16 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: DInt
    MappingId: DInt
    Type: DataPortTreeNode
    Name: "DInt"
    Description: >-
      Logix-Type: DINT (32-bit signed integer, CIP type code 0xC4)
      Size: 4 bytes
      Encoding: little-endian two's complement
      Layout: byte 0 = LSB, byte 3 = MSB
      Range: −2 147 483 648..2 147 483 647
    Icon: datapoint
    DataTypes: [ Int32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: LInt
    MappingId: LInt
    Type: DataPortTreeNode
    Name: "LInt"
    Description: >-
      Logix-Type: LINT (64-bit signed integer, CIP type code 0xC5)
      Size: 8 bytes
      Encoding: little-endian two's complement
      Layout: byte 0 = LSB, byte 7 = MSB
      Range: −9 223 372 036 854 775 808..9 223 372 036 854 775 807
    Icon: datapoint
    DataTypes: [ Int64 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Unsigned integers (5X80 only) ----
  - Id: USInt
    MappingId: USInt
    Type: DataPortTreeNode
    Name: "USInt"
    Description: >-
      Logix-Type: USINT (8-bit unsigned integer, CIP type code 0xC6)
      Size: 1 byte
      Encoding: unsigned binary; a single byte has no byte order
      Layout: byte 0 = the whole value
      Range: 0..255
    Icon: datapoint
    DataTypes: [ UInt8 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: UInt
    MappingId: UInt
    Type: DataPortTreeNode
    Name: "UInt"
    Description: >-
      Logix-Type: UINT (16-bit unsigned integer, CIP type code 0xC7)
      Size: 2 bytes
      Encoding: little-endian unsigned binary
      Layout: byte 0 = LSB, byte 1 = MSB
      Range: 0..65 535
    Icon: datapoint
    DataTypes: [ UInt16 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: UDInt
    MappingId: UDInt
    Type: DataPortTreeNode
    Name: "UDInt"
    Description: >-
      Logix-Type: UDINT (32-bit unsigned integer, CIP type code 0xC8)
      Size: 4 bytes
      Encoding: little-endian unsigned binary
      Layout: byte 0 = LSB, byte 3 = MSB
      Range: 0..4 294 967 295
    Icon: datapoint
    DataTypes: [ UInt32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: ULInt
    MappingId: ULInt
    Type: DataPortTreeNode
    Name: "ULInt"
    Description: >-
      Logix-Type: ULINT (64-bit unsigned integer, CIP type code 0xC9)
      Size: 8 bytes
      Encoding: little-endian unsigned binary
      Layout: byte 0 = LSB, byte 7 = MSB
      Range: 0..18 446 744 073 709 551 615
    Icon: datapoint
    DataTypes: [ UInt64 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Floating point ----
  - Id: Real
    MappingId: Real
    Type: DataPortTreeNode
    Name: "Real"
    Description: >-
      Logix-Type: REAL (32-bit IEEE 754 single-precision float, CIP type code 0xCA)
      Size: 4 bytes
      Encoding: IEEE 754 single-precision float, little-endian
      Layout: byte 0 = LSB (low mantissa), byte 3 = MSB (sign + high exponent)
      Bits: 1 sign + 8 exponent + 23 mantissa
      Range: ±1.18e−38..±3.40e+38
    Icon: datapoint
    DataTypes: [ Float32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: LReal
    MappingId: LReal
    Type: DataPortTreeNode
    Name: "LReal"
    Description: >-
      Logix-Type: LREAL (64-bit IEEE 754 double-precision float, CIP type code 0xCB)
      Size: 8 bytes
      Encoding: IEEE 754 double-precision float, little-endian
      Layout: byte 0 = LSB (low mantissa), byte 7 = MSB (sign + high exponent)
      Bits: 1 sign + 11 exponent + 52 mantissa
      Range: ±2.23e−308..±1.79e+308
    Icon: datapoint
    DataTypes: [ Float64 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- String ----
  - Id: String
    MappingId: String
    Type: DataPortTreeNode
    Name: "String"
    Description: >-
      Logix-Type: STRING (predefined structure, .LEN : DINT + .DATA : SINT[n])
      Size: 4 + n bytes, padded to a 32-bit boundary (88 bytes for the built-in n = 82)
      Encoding: Latin-1, one byte per character; .LEN little-endian two's complement
      Layout: bytes 0..3 = .LEN, bytes 4..(4 + n) = .DATA
      Range: 0..n characters; a longer value is rejected, never truncated
    Icon: datapoint
    DataTypes: [ String ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: MaxLength
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Arrays ----
  # One dimension, transferred whole, and ordered by element type as the scalars above are. Rank 2 and 3
  # exist on Logix and are rejected at connect; per-element access is a container node with indexed
  # children, which is not this.
  - Id: BoolArray
    MappingId: BoolArray
    Type: DataPortTreeNode
    Name: "Bool[]"
    Description: >-
      Logix-Type: BOOL[n] (one-dimensional array of booleans, declared as a DWORD array, CIP type code 0xD3)
      Size: 4 x (n / 32) bytes; the controller packs 32 booleans into every 32-bit word
      Encoding: one bit per element, least significant bit first within each byte
      Layout: element i is bit i mod 8 of byte i div 8
      Range: n must be a multiple of 32, which is the only length Studio 5000 declares a BOOL array with
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'Bool[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: SIntArray
    MappingId: SIntArray
    Type: DataPortTreeNode
    Name: "SInt[]"
    Description: >-
      Logix-Type: SINT[n] (one-dimensional array of 8-bit signed integers, CIP type code 0xC2)
      Size: n bytes
      Encoding: two's complement per element; a single byte has no byte order, and elements are unpadded
      Layout: element i occupies byte i
      Range: −128..127 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'Int8[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: IntArray
    MappingId: IntArray
    Type: DataPortTreeNode
    Name: "Int[]"
    Description: >-
      Logix-Type: INT[n] (one-dimensional array of 16-bit signed integers, CIP type code 0xC3)
      Size: 2 x n bytes
      Encoding: little-endian two's complement per element; no padding between elements
      Layout: element i occupies bytes 2i and 2i + 1
      Range: −32 768..32 767 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'Int16[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: DIntArray
    MappingId: DIntArray
    Type: DataPortTreeNode
    Name: "DInt[]"
    Description: >-
      Logix-Type: DINT[n] (one-dimensional array of 32-bit signed integers, CIP type code 0xC4)
      Size: 4 x n bytes
      Encoding: little-endian two's complement per element; no padding between elements
      Layout: element i occupies bytes 4i..4i + 3
      Range: −2 147 483 648..2 147 483 647 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'Int32[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: LIntArray
    MappingId: LIntArray
    Type: DataPortTreeNode
    Name: "LInt[]"
    Description: >-
      Logix-Type: LINT[n] (one-dimensional array of 64-bit signed integers, CIP type code 0xC5)
      Size: 8 x n bytes
      Encoding: little-endian two's complement per element; no padding between elements
      Layout: element i occupies bytes 8i..8i + 7
      Range: −9 223 372 036 854 775 808..9 223 372 036 854 775 807 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'Int64[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: USIntArray
    MappingId: USIntArray
    Type: DataPortTreeNode
    Name: "USInt[]"
    Description: >-
      Logix-Type: USINT[n] (one-dimensional array of 8-bit unsigned integers, CIP type code 0xC6)
      Size: n bytes
      Encoding: unsigned binary per element; a single byte has no byte order, and elements are unpadded
      Layout: element i occupies byte i
      Range: 0..255 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'UInt8[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: UIntArray
    MappingId: UIntArray
    Type: DataPortTreeNode
    Name: "UInt[]"
    Description: >-
      Logix-Type: UINT[n] (one-dimensional array of 16-bit unsigned integers, CIP type code 0xC7)
      Size: 2 x n bytes
      Encoding: little-endian unsigned binary per element; no padding between elements
      Layout: element i occupies bytes 2i and 2i + 1
      Range: 0..65 535 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'UInt16[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: UDIntArray
    MappingId: UDIntArray
    Type: DataPortTreeNode
    Name: "UDInt[]"
    Description: >-
      Logix-Type: UDINT[n] (one-dimensional array of 32-bit unsigned integers, CIP type code 0xC8)
      Size: 4 x n bytes
      Encoding: little-endian unsigned binary per element; no padding between elements
      Layout: element i occupies bytes 4i..4i + 3
      Range: 0..4 294 967 295 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'UInt32[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: ULIntArray
    MappingId: ULIntArray
    Type: DataPortTreeNode
    Name: "ULInt[]"
    Description: >-
      Logix-Type: ULINT[n] (one-dimensional array of 64-bit unsigned integers, CIP type code 0xC9)
      Size: 8 x n bytes
      Encoding: little-endian unsigned binary per element; no padding between elements
      Layout: element i occupies bytes 8i..8i + 7
      Range: 0..18 446 744 073 709 551 615 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'UInt64[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: RealArray
    MappingId: RealArray
    Type: DataPortTreeNode
    Name: "Real[]"
    Description: >-
      Logix-Type: REAL[n] (one-dimensional array of 32-bit IEEE 754 single-precision floats, CIP type code 0xCA)
      Size: 4 x n bytes
      Encoding: IEEE 754 single-precision float per element, little-endian; no padding between elements
      Layout: element i occupies bytes 4i..4i + 3
      Range: ±1.18e−38..±3.40e+38 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'Float32[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: LRealArray
    MappingId: LRealArray
    Type: DataPortTreeNode
    Name: "LReal[]"
    Description: >-
      Logix-Type: LREAL[n] (one-dimensional array of 64-bit IEEE 754 double-precision floats, CIP type code 0xCB)
      Size: 8 x n bytes
      Encoding: IEEE 754 double-precision float per element, little-endian; no padding between elements
      Layout: element i occupies bytes 8i..8i + 7
      Range: ±2.23e−308..±1.79e+308 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Icon: datapoint
    DataTypes: [ 'Float64[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

# ==================== PROPERTY CATEGORIES ===========================

PropertyCategories:

  - Id: Connection
    Name: "Connection"
    Description: "Which controller to reach, and how long one operation against it may take"

  - Id: QueueConfiguration
    Name: "Queue Configuration"
    Description: "How the outgoing write queue behaves when the controller cannot keep up"

  - Id: TagScope
    Name: "Scope"
    Description: "Which part of the controller's tag space these tags live in"

  - Id: TagAddress
    Name: "Tag Address"
    Description: "Studio 5000 tag name"

  - Id: TagDeclaration
    Name: "Tag Declaration"
    Description: "How the tag is declared in Studio 5000, where the type alone does not say"

  - Id: ReadConfiguration
    Name: "Read configuration"
    Description: "Configure properties for reading data points"

# ==================== PROPERTIES ===================================

Properties:

  # ---- TagScope Properties ----
  # The editor's half of LogixIdentifier.IsWellFormed, shared with TagName because a program name and
  # a tag name are one rule. Two patterns rather than one: a manifest pattern is compiled
  # NonBacktracking, which has no lookaheads to carry the length bound in. \A and \z rather than ^ and
  # $, because in .NET $ also matches before a trailing newline and would let "Count\n" through.
  - Id: ProgramName
    Name: "Program name"
    Description: "Name of the program as it appears in Studio 5000. Tags below it address as \"Program:MainProgram.Count\"."
    DataType: String
    UiControl: TextBox
    DefaultValue: "MainProgram"
    Validations: &logix-identifier-validations
      - Type: Regex
        Pattern: '\A[A-Za-z_](_?[A-Za-z0-9])*\z'
        Message: "Must start with a letter or an underscore, then letters, digits and single underscores — no two underscores in a row, and none at the end."
      - Type: Regex
        Pattern: '\A.{1,40}\z'
        Message: "Must be 1 to 40 characters long."

  # ---- Connection Properties ----
  # Non-empty and no more: neither a host name nor a CIP route has a shape this file could decide —
  # a hop into another chassis carries the IP of the interface it goes through, not just digits.
  - Id: ConnectionEndpoint
    Name: "Connection endpoint"
    Description: "IP address or host name of the controller's EtherNet/IP interface"
    DataType: String
    UiControl: TextBox
    DefaultValue: ""
    Validations:
      - Type: Regex
        Pattern: '\A\S+\z'
        Message: "Connection endpoint must be the IP address or host name of the controller."

  - Id: TcpPort
    Name: "TCP port"
    Description: "TCP port the controller's EtherNet/IP interface listens on. 44818 is the registered one; change it only for a NAT rule or a tunnel that moved it"
    DataType: UInt16
    UiControl: NumericUpDown
    DefaultValue: 44818
    MinValue: 1

  - Id: CipRoutePath
    Name: "CIP route path"
    Description: "CIP route path from the EtherNet/IP interface to the CPU, one hop per port and address, e.g. \"1,0\" for backplane slot 0"
    DataType: String
    UiControl: TextBox
    DefaultValue: "1,0"
    Validations:
      - Type: Regex
        Pattern: '\A\S+\z'
        Message: "CIP route path must be the sequence of hops to the CPU, e.g. \"1,0\"."

  - Id: OperationTimeout
    Name: "Operation Timeout (ms)"
    Description: "How long one tag read or write against this controller may take before it is aborted"
    DataType: Int32
    UiControl: NumericUpDown
    DefaultValue: 5000
    MinValue: 100

  # ---- QueueConfiguration Properties ----
  # Read by the outgoing port only; an inbound-only device carries the defaults and builds no queue.
  - Id: MaxPendingMessages
    Name: "Max pending messages"
    Description: "How many write batches may wait for the controller before the strategy below applies"
    DataType: Int32
    UiControl: NumericUpDown
    DefaultValue: 100000
    MinValue: 1

  - Id: Strategy
    Name: "Queue overflow strategy"
    Description: "What a full write queue drops: the oldest batch keeps the freshest value moving, the newest preserves write order"
    DataType: UInt8
    UiControl: NumericListBox
    DefaultValue: 0
    Elements: { 0: 'Drop Oldest', 1: 'Drop Newest' }
    # QueueStrategy has these two members and no others — the Enum.IsDefined check, as a manifest
    # can write it.
    MinValue: 0
    MaxValue: 1

  # ---- TagAddress Properties ----
  # The bare name, never an address: the tree walk composes the scope, so the rule is ProgramName's.
  - Id: TagName
    Name: "Tag name"
    Description: "Studio 5000 tag name (e.g. \"MotorSpeed\")"
    DataType: String
    UiControl: TextBox
    DefaultValue: ""
    Validations: *logix-identifier-validations

  # ---- TagDeclaration Properties ----
  - Id: MaxLength
    Name: "Maximum length (characters)"
    Description: "Character capacity the tag is declared with: 82 for the built-in STRING, 20 for a STRING_20"
    DataType: Int32
    UiControl: NumericUpDown
    DefaultValue: 82
    MinValue: 1

  # Held against the controller's own declaration on connect, not treated as a bound: a tag resized in
  # Studio 5000 is invisible to a read that only takes the first elements.
  - Id: ElementCount
    Name: "Element count"
    Description: "How many elements the array is declared with in Studio 5000: 10 for an ARRAY[0..9]"
    DataType: UInt32
    UiControl: NumericUpDown
    DefaultValue: 10
    MinValue: 1

  # ---- ReadConfiguration Properties ----
  - Id: PollFrequency
    Name: "Poll frequency (ms)"
    Description: "Define how often the data point should be read from the controller"
    DataType: Int32
    UiControl: NumericUpDown
    DefaultValue: 500
    MinValue: 100

