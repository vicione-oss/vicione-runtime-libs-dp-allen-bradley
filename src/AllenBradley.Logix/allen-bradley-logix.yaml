Common:
  Target: DataPort
  ContentType: Rules
  Version: 1.0
  Date: 2026-08-24
  Description: "Allen-Bradley Logix DataPort - symbolic tag addressing"
  Author: "ifm software gmbh"
  MetadataType: YAML
  Namespace: "ViciOne.DataPort.AllenBradley.Logix"

Root:
  Id: "AllenBradley.Logix"
  Name: "Allen-Bradley Logix"
  Description: "DataPort for Allen-Bradley ControlLogix / CompactLogix controllers over CIP (EtherNet/IP)"
  Icon: allen-bradley-logix
  ChildNodes:
    - Id: DeviceControlLogix5X70
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceControlLogix5X80
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceCompactLogix5X70
      MaxDepth: 64
      MaxInstances: 16
    - Id: DeviceCompactLogix5X80
      MaxDepth: 64
      MaxInstances: 16

Nodes:

  # ==================== DEVICE ===================================
  # One node id per family and generation: the family decides how a request reaches the CPU, the
  # generation which types the tree offers.

  - Id: DeviceControlLogix5X70
    Type: DataPortNode
    Name: "ControlLogix 5X70"
    Description: "Allen-Bradley ControlLogix 5550/5560/5570 controller in a 1756 chassis, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: controllogix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: &controllogix-device-properties
      - Id: Connection
        Properties:
          - Id: ConnectionEndpoint
            Required: true
          - Id: TcpPort
          - Id: CipRoutePath
            Required: true
          - Id: OperationTimeout
      - Id: QueueConfiguration
        Properties: &queue-properties
          - Id: MaxPendingMessages
          - Id: Strategy
    ChildNodes:
      - Id: ControllerTags5X70
      - Id: ProgramTags5X70

  - Id: DeviceControlLogix5X80
    Type: DataPortNode
    Name: "ControlLogix 5X80"
    Description: "Allen-Bradley ControlLogix 5580 controller in a 1756 chassis, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: controllogix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: *controllogix-device-properties
    ChildNodes:
      - Id: ControllerTags5X80
      - Id: ProgramTags5X80

  # No CipRoutePath: a CompactLogix's virtual backplane puts the controller at slot 0, so "1,0" is
  # the only legal answer and DeviceNodeMapper supplies it rather than asking for it.

  - Id: DeviceCompactLogix5X70
    Type: DataPortNode
    Name: "CompactLogix 5X70"
    Description: "Allen-Bradley CompactLogix 1769/5370 controller on a DIN rail, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: compactlogix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: &compactlogix-device-properties
      - Id: Connection
        Properties:
          - Id: ConnectionEndpoint
            Required: true
          - Id: TcpPort
          - Id: OperationTimeout
      - Id: QueueConfiguration
        Properties: *queue-properties
    ChildNodes:
      - Id: ControllerTags5X70
      - Id: ProgramTags5X70

  - Id: DeviceCompactLogix5X80
    Type: DataPortNode
    Name: "CompactLogix 5X80"
    Description: "Allen-Bradley CompactLogix 5380/5480 controller on a DIN rail, reached over EtherNet/IP."
    MetadataLength: 0
    Icon: compactlogix
    TransferDirections: [ Inbound, Outbound ]
    PropertyCategories: *compactlogix-device-properties
    ChildNodes:
      - Id: ControllerTags5X80
      - Id: ProgramTags5X80

  # ==================== TAG CONTAINERS ===============================
  # One per scope and generation, differing only in the child list. Withholding the 5X80 group is
  # the whole of what keeps the editor from offering a 5X80-only type on a controller that has not
  # got it; the MappingIds differ so the generation reaches the mapped node, which gates the same
  # types again for a configuration the editor did not build.

  - Id: ControllerTags5X70
    MappingId: ControllerTags5X70
    Type: DataPortTreeNode
    Name: "Controller Tags"
    Description: "Controller-scope tags of a 5X70 controller. Adds no segment to the tag address."
    Icon: controller-tags
    TransferModes: [ None ]
    ChildNodes: &basic-tag-nodes
      # Grouped by type family, widest last within a family, and in the order the tag node
      # definitions below are written.
      - Id: Bool
      # Signed integers
      - Id: SInt
      - Id: Int
      - Id: DInt
      - Id: LInt
      # Floating point
      - Id: Real
      # String
      - Id: String
      # Timer — the accumulated time of a TIMER
      - Id: Timer
      # Counter — the accumulated value of a COUNTER
      - Id: Counter
      # Arrays — grouped by shape rather than by element type, because that is what they have in common
      - Id: BoolArray
      - Id: SIntArray
      - Id: IntArray
      - Id: DIntArray
      - Id: LIntArray
      - Id: RealArray
      # Array containers — the same arrays, one data point per element
      - Id: SIntArrayContainer
      - Id: IntArrayContainer
      - Id: DIntArrayContainer
      - Id: LIntArrayContainer
      - Id: RealArrayContainer
      # UDT — a user-defined data type, one data point per member
      - Id: Udt5X70

  - Id: ControllerTags5X80
    MappingId: ControllerTags5X80
    Type: DataPortTreeNode
    Name: "Controller Tags"
    Description: "Controller-scope tags of a 5X80 controller, which adds the unsigned integers and LREAL. Adds no segment to the tag address."
    Icon: controller-tags
    TransferModes: [ None ]
    ChildNodes: &logix5x80-tag-nodes
      # *basic-tag-nodes spelled out again: YAML merges mappings, not sequences. Same grouping,
      # with each 5X80-only type in the family it belongs to rather than in a block of its own.
      - Id: Bool
      # Signed integers
      - Id: SInt
      - Id: Int
      - Id: DInt
      - Id: LInt
      # Unsigned integers — 5X80 only
      - Id: USInt
      - Id: UInt
      - Id: UDInt
      - Id: ULInt
      # Floating point — LREAL is 5X80 only
      - Id: Real
      - Id: LReal
      # String
      - Id: String
      # Timer — the accumulated time of a TIMER
      - Id: Timer
      # Counter — the accumulated value of a COUNTER
      - Id: Counter
      # Arrays
      - Id: BoolArray
      - Id: SIntArray
      - Id: IntArray
      - Id: DIntArray
      - Id: LIntArray
      # Unsigned integer arrays — 5X80 only
      - Id: USIntArray
      - Id: UIntArray
      - Id: UDIntArray
      - Id: ULIntArray
      - Id: RealArray
      # LREAL array — 5X80 only
      - Id: LRealArray
      # Array containers
      - Id: SIntArrayContainer
      - Id: IntArrayContainer
      - Id: DIntArrayContainer
      - Id: LIntArrayContainer
      # Unsigned integer array containers — 5X80 only
      - Id: USIntArrayContainer
      - Id: UIntArrayContainer
      - Id: UDIntArrayContainer
      - Id: ULIntArrayContainer
      - Id: RealArrayContainer
      # LREAL array container — 5X80 only
      - Id: LRealArrayContainer
      # UDT — a user-defined data type, one data point per member
      - Id: Udt5X80

  # A peer of controller scope under the device rather than a child of it, the way Studio 5000's own
  # tree puts them, and uncapped — a controller has as many programs as it has.

  - Id: ProgramTags5X70
    MappingId: ProgramTags5X70
    Type: DataPortTreeNode
    Name: "Program"
    Description: "Program-scope tags of a 5X70 controller. Adds the Program:<name> segment to every tag address below it."
    Icon: program-tags
    TransferModes: [ None ]
    PropertyCategories: &program-tags-properties
      - Id: TagScope
        Properties:
          - Id: ProgramName
            Required: true
    ChildNodes: *basic-tag-nodes

  - Id: ProgramTags5X80
    MappingId: ProgramTags5X80
    Type: DataPortTreeNode
    Name: "Program"
    Description: "Program-scope tags of a 5X80 controller, which adds the unsigned integers and LREAL. Adds the Program:<name> segment to every tag address below it."
    Icon: program-tags
    TransferModes: [ None ]
    PropertyCategories: *program-tags-properties
    ChildNodes: *logix5x80-tag-nodes

  # ==================== TAG NODES ======================================
  # Grouped by type family and widening within a family, in the order the child lists above name
  # them. A 5X80-only type sits in its family rather than in a block of its own; what withholds it
  # from a 5X70 is the child list, not the position here.

  # ---- Bool ----
  - Id: Bool
    MappingId: Bool
    Type: DataPortTreeNode
    Name: "Bool"
    Description: >-
      Logix-Type: BOOL (single-byte boolean, CIP type code 0xC1)
      Size: 1 byte
      Encoding: nonzero is true; a written true is 0xFF
      Layout: byte 0 = the whole value
      Range: false, true
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Bool ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Signed integers ----
  - Id: SInt
    MappingId: SInt
    Type: DataPortTreeNode
    Name: "SInt"
    Description: >-
      Logix-Type: SINT (8-bit signed integer, CIP type code 0xC2)
      Size: 1 byte
      Encoding: two's complement; a single byte has no byte order
      Layout: byte 0 = the whole value
      Range: −128..127
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Int8 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: Int
    MappingId: Int
    Type: DataPortTreeNode
    Name: "Int"
    Description: >-
      Logix-Type: INT (16-bit signed integer, CIP type code 0xC3)
      Size: 2 bytes
      Encoding: little-endian two's complement
      Layout: byte 0 = LSB, byte 1 = MSB
      Range: −32 768..32 767
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Int16 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: DInt
    MappingId: DInt
    Type: DataPortTreeNode
    Name: "DInt"
    Description: >-
      Logix-Type: DINT (32-bit signed integer, CIP type code 0xC4)
      Size: 4 bytes
      Encoding: little-endian two's complement
      Layout: byte 0 = LSB, byte 3 = MSB
      Range: −2 147 483 648..2 147 483 647
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Int32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: LInt
    MappingId: LInt
    Type: DataPortTreeNode
    Name: "LInt"
    Description: >-
      Logix-Type: LINT (64-bit signed integer, CIP type code 0xC5)
      Size: 8 bytes
      Encoding: little-endian two's complement
      Layout: byte 0 = LSB, byte 7 = MSB
      Range: −9 223 372 036 854 775 808..9 223 372 036 854 775 807
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Int64 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Unsigned integers (5X80 only) ----
  - Id: USInt
    MappingId: USInt
    Type: DataPortTreeNode
    Name: "USInt"
    Description: >-
      Logix-Type: USINT (8-bit unsigned integer, CIP type code 0xC6)
      Size: 1 byte
      Encoding: unsigned binary; a single byte has no byte order
      Layout: byte 0 = the whole value
      Range: 0..255
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ UInt8 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: UInt
    MappingId: UInt
    Type: DataPortTreeNode
    Name: "UInt"
    Description: >-
      Logix-Type: UINT (16-bit unsigned integer, CIP type code 0xC7)
      Size: 2 bytes
      Encoding: little-endian unsigned binary
      Layout: byte 0 = LSB, byte 1 = MSB
      Range: 0..65 535
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ UInt16 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: UDInt
    MappingId: UDInt
    Type: DataPortTreeNode
    Name: "UDInt"
    Description: >-
      Logix-Type: UDINT (32-bit unsigned integer, CIP type code 0xC8)
      Size: 4 bytes
      Encoding: little-endian unsigned binary
      Layout: byte 0 = LSB, byte 3 = MSB
      Range: 0..4 294 967 295
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ UInt32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: ULInt
    MappingId: ULInt
    Type: DataPortTreeNode
    Name: "ULInt"
    Description: >-
      Logix-Type: ULINT (64-bit unsigned integer, CIP type code 0xC9)
      Size: 8 bytes
      Encoding: little-endian unsigned binary
      Layout: byte 0 = LSB, byte 7 = MSB
      Range: 0..18 446 744 073 709 551 615
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ UInt64 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Floating point ----
  - Id: Real
    MappingId: Real
    Type: DataPortTreeNode
    Name: "Real"
    Description: >-
      Logix-Type: REAL (32-bit IEEE 754 single-precision float, CIP type code 0xCA)
      Size: 4 bytes
      Encoding: IEEE 754 single-precision float, little-endian
      Layout: byte 0 = LSB (low mantissa), byte 3 = MSB (sign + high exponent)
      Bits: 1 sign + 8 exponent + 23 mantissa
      Range: ±1.18e−38..±3.40e+38
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Float32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: LReal
    MappingId: LReal
    Type: DataPortTreeNode
    Name: "LReal"
    Description: >-
      Logix-Type: LREAL (64-bit IEEE 754 double-precision float, CIP type code 0xCB)
      Size: 8 bytes
      Encoding: IEEE 754 double-precision float, little-endian
      Layout: byte 0 = LSB (low mantissa), byte 7 = MSB (sign + high exponent)
      Bits: 1 sign + 11 exponent + 52 mantissa
      Range: ±2.23e−308..±1.79e+308
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Float64 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- String ----
  - Id: String
    MappingId: String
    Type: DataPortTreeNode
    Name: "String"
    Description: >-
      Logix-Type: STRING (predefined structure, .LEN : DINT + .DATA : SINT[n])
      Size: 4 + n bytes, padded to a 32-bit boundary (88 bytes for the built-in n = 82)
      Encoding: Latin-1, one byte per character; .LEN little-endian two's complement
      Layout: bytes 0..3 = .LEN, bytes 4..(4 + n) = .DATA
      Range: 0..n characters; a longer value is rejected, never truncated
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ String ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: MaxLength
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Timer ----
  # Configured and verified as the whole TIMER, but the handle reaches .ACC alone: writing the whole
  # structure would put back status bits the scan has changed since they were read.
  - Id: Timer
    MappingId: Timer
    Type: DataPortTreeNode
    Name: "Timer"
    Description: >-
      Logix-Type: TIMER (predefined structure, the same for TON, TOF and RTO)
      Value: the accumulated time (.ACC) in milliseconds, a DINT
      Access: reads and writes the .ACC member only; .PRE, .EN, .TT and .DN are left untouched
      Tag name: the timer's own name, without a member, so "Delay1" and not "Delay1.ACC"
      Range: 0..2 147 483 647; a negative value is refused, because it causes a major fault that stops the controller
      Other members: to reach .PRE, .EN, .TT or .DN, add a UDT Instance with the timer's name instead
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Int32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Counter ----
  # Configured and verified as the whole COUNTER, but the handle reaches .ACC alone, for the same reason
  # as the timer's.
  - Id: Counter
    MappingId: Counter
    Type: DataPortTreeNode
    Name: "Counter"
    Description: >-
      Logix-Type: COUNTER (predefined structure, the same for CTU and CTD)
      Value: the accumulated value (.ACC) in counts, a DINT
      Access: reads and writes the .ACC member only; .PRE, .CU, .CD, .DN, .OV and .UN are left untouched
      Tag name: the counter's own name, without a member, so "Parts1" and not "Parts1.ACC"
      Range: -2 147 483 648..2 147 483 647; a CTD counts below zero
      Other members: to reach .PRE, .CU, .CD, .DN, .OV or .UN, add a UDT Instance with the counter's name instead
    Namespace: "Scalar"
    Icon: datapoint
    DataTypes: [ Int32 ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  # ---- Arrays ----
  # One dimension, transferred whole, and ordered by element type as the scalars above are. Rank 2 and 3
  # exist on Logix and are rejected at connect; per-element access is a container node with indexed
  # children, which is not this.
  - Id: BoolArray
    MappingId: BoolArray
    Type: DataPortTreeNode
    Name: "Bool[]"
    Description: >-
      Logix-Type: BOOL[n] (one-dimensional array of booleans, declared as a DWORD array, CIP type code 0xD3)
      Size: 4 x (n / 32) bytes; the controller packs 32 booleans into every 32-bit word
      Encoding: one bit per element, least significant bit first within each byte
      Layout: element i is bit i mod 8 of byte i div 8
      Range: n must be a multiple of 32, which is the only length Studio 5000 declares a BOOL array with
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Namespace: "Array"
    Icon: datapoint
    DataTypes: [ 'Bool[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: SIntArray
    MappingId: SIntArray
    Type: DataPortTreeNode
    Name: "SInt[]"
    Description: >-
      Logix-Type: SINT[n] (one-dimensional array of 8-bit signed integers, CIP type code 0xC2)
      Size: n bytes
      Encoding: two's complement per element; a single byte has no byte order, and elements are unpadded
      Layout: element i occupies byte i
      Range: −128..127 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Namespace: "Array"
    Icon: datapoint
    DataTypes: [ 'Int8[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: IntArray
    MappingId: IntArray
    Type: DataPortTreeNode
    Name: "Int[]"
    Description: >-
      Logix-Type: INT[n] (one-dimensional array of 16-bit signed integers, CIP type code 0xC3)
      Size: 2 x n bytes
      Encoding: little-endian two's complement per element; no padding between elements
      Layout: element i occupies bytes 2i and 2i + 1
      Range: −32 768..32 767 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Namespace: "Array"
    Icon: datapoint
    DataTypes: [ 'Int16[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: DIntArray
    MappingId: DIntArray
    Type: DataPortTreeNode
    Name: "DInt[]"
    Description: >-
      Logix-Type: DINT[n] (one-dimensional array of 32-bit signed integers, CIP type code 0xC4)
      Size: 4 x n bytes
      Encoding: little-endian two's complement per element; no padding between elements
      Layout: element i occupies bytes 4i..4i + 3
      Range: −2 147 483 648..2 147 483 647 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Namespace: "Array"
    Icon: datapoint
    DataTypes: [ 'Int32[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: LIntArray
    MappingId: LIntArray
    Type: DataPortTreeNode
    Name: "LInt[]"
    Description: >-
      Logix-Type: LINT[n] (one-dimensional array of 64-bit signed integers, CIP type code 0xC5)
      Size: 8 x n bytes
      Encoding: little-endian two's complement per element; no padding between elements
      Layout: element i occupies bytes 8i..8i + 7
      Range: −9 223 372 036 854 775 808..9 223 372 036 854 775 807 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Namespace: "Array"
    Icon: datapoint
    DataTypes: [ 'Int64[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: USIntArray
    MappingId: USIntArray
    Type: DataPortTreeNode
    Name: "USInt[]"
    Description: >-
      Logix-Type: USINT[n] (one-dimensional array of 8-bit unsigned integers, CIP type code 0xC6)
      Size: n bytes
      Encoding: unsigned binary per element; a single byte has no byte order, and elements are unpadded
      Layout: element i occupies byte i
      Range: 0..255 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Namespace: "Array"
    Icon: datapoint
    DataTypes: [ 'UInt8[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
      - Id: ReadConfiguration
        Properties:
          - Id: PollFrequency
            Required: true

  - Id: UIntArray
    MappingId: UIntArray
    Type: DataPortTreeNode
    Name: "UInt[]"
    Description: >-
      Logix-Type: UINT[n] (one-dimensional array of 16-bit unsigned integers, CIP type code 0xC7)
      Size: 2 x n bytes
      Encoding: little-endian unsigned binary per element; no padding between elements
      Layout: element i occupies bytes 2i and 2i + 1
      Range: 0..65 535 per element
      Direction: read and write; the whole array is one value, and a value of another length is refused
    Namespace: "Array"
    Icon: datapoint
    DataTypes: [ 'UInt16[]' ]
    TransferModes: [ OnChange, Periodic ]
    PropertyCategories:
      - Id: TagAddress
        Properties:
          - Id: TagName
            Required: true
      - Id: TagDeclaration
        Properties:
          - Id: ElementCount
            Required: true
