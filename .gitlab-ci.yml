# Component-based pipeline modeled on the Siemens S7 repo. Each dataport (Logix, Legacy)
# is packaged and published as its own module, from one shared version.
#
# Dropped versus S7, because the inputs don't exist in this repo yet:
#   - "Verify licenses" — needs THIRD-PARTY-NOTICES.md and scripts/verify-licenses.sh
#   - "Lint dockerfiles" — there are no Dockerfiles here

# Pinned to the SDK feature band required by global.json (rollForward: latestPatch).
.sdk-image: &sdk-image 'mcr.microsoft.com/dotnet/sdk:10.0.300'

.rule_tag: &rule_tag
  if: "$CI_COMMIT_TAG"

.rule_tag_manual: &rule_tag_manual
  <<: *rule_tag
  when: manual
  allow_failure: true

.rule_default_branch: &rule_default_branch
  if: "$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH"

.rule_default_branch_manual: &rule_default_branch_manual
  <<: *rule_default_branch
  when: manual
  allow_failure: true

.rule_mr: &rule_mr
  if: '$CI_PIPELINE_SOURCE == "merge_request_event"'

.rule_mr_manual: &rule_mr_manual
  <<: *rule_mr
  when: manual
  allow_failure: true

.rule_web: &rule_web
  if: '$CI_PIPELINE_SOURCE == "web"'

.rule_web_manual: &rule_web_manual
  <<: *rule_web
  when: manual
  allow_failure: true

.rules_always: &rules_always
  - *rule_tag
  - *rule_default_branch
  - *rule_mr
  - *rule_web

.rules_manual: &rules_manual
  - *rule_tag_manual
  - *rule_default_branch_manual
  - *rule_mr_manual
  - *rule_web_manual

.rules_only_tags_manual: &rules_only_tags_manual
  - *rule_tag_manual

.rules_not_tags_manual: &rules_not_tags_manual
  - *rule_default_branch_manual
  - *rule_mr_manual
  - *rule_web_manual

.exec_matrix: &exec_matrix
  - OS: linux
    ARCH: [x64, arm64]
  - OS: win
    ARCH: [x64]

.update_nuget_source_ro: &update_nuget_source_ro
  - dotnet nuget update source JFrogNuGetProxy --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text
  - dotnet nuget update source JFrogViciOne --configfile NuGet.Config -u $NuGet_User_JFrog -p $NuGet_PW_JFrog --store-password-in-clear-text

default:
  image: *sdk-image

variables:
  FULLNAME_LOGIX: "ViciOne.Suite.DataPort.AllenBradley.Logix"
  FULLNAME_LEGACY: "ViciOne.Suite.DataPort.AllenBradley.Legacy"

stages:
  - metadata
  - test
  - pack
  - publish
  - promote

include:
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/version/version-calc@v1.1.1
    inputs:
      rules: *rules_always
  # One job for both modules: it writes a fixed runtime_identifiers.json, and both
  # projects take their RIDs from Directory.Build.props.
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/runtime-identifier@v0.2.0
    inputs:
      project: "src/AllenBradley.Logix/AllenBradley.Logix.csproj"
      rules: *rules_always
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/metadata@v0.2.0
    inputs:
      name: "Generate packaging metadata (logix-dataport)"
      stage: metadata
      rules: *rules_always
      project: "src/AllenBradley.Logix/AllenBradley.Logix.csproj"
      module_version: "${Version}"
      metadata_json: "src/AllenBradley.Logix/metadata.json"
      metadata_dir: "metadata/logix"
      min_core_version_file: "VERSION_CORE"
      min_core_version_property: "MinCoreVersion"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/metadata@v0.2.0
    inputs:
      name: "Generate packaging metadata (legacy-dataport)"
      stage: metadata
      rules: *rules_always
      project: "src/AllenBradley.Legacy/AllenBradley.Legacy.csproj"
      module_version: "${Version}"
      metadata_json: "src/AllenBradley.Legacy/metadata.json"
      metadata_dir: "metadata/legacy"
      min_core_version_file: "VERSION_CORE"
      min_core_version_property: "MinCoreVersion"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-restore@2
    inputs:
      image: *sdk-image
      before_script:
        - *update_nuget_source_ro
      rules: *rules_always
  # Runs on every pipeline, tags included, so a release never ships without the
  # tests having run. The unit suite is PLC-safe by default; the integration suite
  # needs the L32E and is not exercised in CI.
  #
  # The NuGet auth is required even though the build passes --no-restore: the docs
  # projects use the NuGet-resolved MSBuild SDK Microsoft.Build.NoTargets, which
  # MSBuild fetches at evaluation time into the global packages folder rather than
  # the ./packages directory dotnet Restore caches.
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-artifacts@2
    inputs:
      name: "dotnet build & test"
      stage: test
      image: *sdk-image
      rules: *rules_always
      before_script:
        - *update_nuget_source_ro
      build: true
      test: true
      test_coverage: true
      # No test_filter input: the unit suite is selected by default via the
      # test-suite property in tests/Directory.Build.props. An explicit filter
      # would be passed as --filter-query and clash with the injected
      # simple-style filter under xUnit v3.

  # Publish RIDs
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-publish@2
    inputs:
      name: "dotnet publish (logix-dataport)"
      stage: pack
      image: *sdk-image
      rules: *rules_manual
      project: "src/AllenBradley.Logix/AllenBradley.Logix.csproj"
      output_directory: "artifacts/logix/${OS}-${ARCH}"
      self_contained: "true"
      before_script:
        - *update_nuget_source_ro
        - dotnet restore
      execution_matrix: *exec_matrix
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/dotnet-component/dotnet-publish@2
    inputs:
      name: "dotnet publish (legacy-dataport)"
      stage: pack
      image: *sdk-image
      rules: *rules_manual
      project: "src/AllenBradley.Legacy/AllenBradley.Legacy.csproj"
      output_directory: "artifacts/legacy/${OS}-${ARCH}"
      self_contained: "true"
      before_script:
        - *update_nuget_source_ro
        - dotnet restore
      execution_matrix: *exec_matrix

  # Package binaries
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/package-module@v0.2.0
    inputs:
      name: "create zip (logix-dataport)"
      stage: pack
      rules: *rules_always
      publish_job: "dotnet publish (logix-dataport)"
      metadata_job: "Generate packaging metadata (logix-dataport)"
      build_dir: "artifacts/logix"
      metadata_dir: "metadata/logix"
      before_script:
        - apt update
        - apt install jq zip -y
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/module-packaging/package-module@v0.2.0
    inputs:
      name: "create zip (legacy-dataport)"
      stage: pack
      rules: *rules_always
      publish_job: "dotnet publish (legacy-dataport)"
      metadata_job: "Generate packaging metadata (legacy-dataport)"
      build_dir: "artifacts/legacy"
      metadata_dir: "metadata/legacy"
      before_script:
        - apt update
        - apt install jq zip -y

  # Prerelease to dev repository
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v1.0.0
    inputs:
      name: "Upload to jfrog-dev (logix-dataport)"
      stage: publish
      rules: *rules_not_tags_manual
      repository: "vicione-suite-dev"
      upload_path: "fbs/${FULLNAME_LOGIX}"
      needs:
        - "Generate packaging metadata (logix-dataport)"
        - "create zip (logix-dataport)"
      artifacts:
        - "artifacts/logix/**/*json"
        - "artifacts/logix/**/*zip"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v1.0.0
    inputs:
      name: "Upload to jfrog-dev (legacy-dataport)"
      stage: publish
      rules: *rules_not_tags_manual
      repository: "vicione-suite-dev"
      upload_path: "fbs/${FULLNAME_LEGACY}"
      needs:
        - "Generate packaging metadata (legacy-dataport)"
        - "create zip (legacy-dataport)"
      artifacts:
        - "artifacts/legacy/**/*json"
        - "artifacts/legacy/**/*zip"

  # Release to staging repository (on tag)
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v1.0.0
    inputs:
      name: "Upload to jfrog-staging (logix-dataport)"
      stage: publish
      rules: *rules_only_tags_manual
      repository: "vicione-suite-staging"
      upload_path: "fbs/${FULLNAME_LOGIX}"
      needs:
        - "Generate packaging metadata (logix-dataport)"
        - "create zip (logix-dataport)"
      artifacts:
        - "artifacts/logix/**/*json"
        - "artifacts/logix/**/*zip"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/release@v1.0.0
    inputs:
      name: "Upload to jfrog-staging (legacy-dataport)"
      stage: publish
      rules: *rules_only_tags_manual
      repository: "vicione-suite-staging"
      upload_path: "fbs/${FULLNAME_LEGACY}"
      needs:
        - "Generate packaging metadata (legacy-dataport)"
        - "create zip (legacy-dataport)"
      artifacts:
        - "artifacts/legacy/**/*json"
        - "artifacts/legacy/**/*zip"

  # Promote staging to production (on tag) — moves the exact tested artifacts
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/promote@v1.0.0
    inputs:
      name: "promote to jfrog-releases (logix-dataport)"
      stage: promote
      rules: *rules_only_tags_manual
      source_repository: "vicione-suite-staging"
      destination_repository: "vicione-suite"
      artifacts:
        - "artifacts/logix/**/*json"
        - "artifacts/logix/**/*zip"
  - component: $CI_SERVER_FQDN/vicione-oss/tooling/components/jfrog/promote@v1.0.0
    inputs:
      name: "promote to jfrog-releases (legacy-dataport)"
      stage: promote
      rules: *rules_only_tags_manual
      source_repository: "vicione-suite-staging"
      destination_repository: "vicione-suite"
      artifacts:
        - "artifacts/legacy/**/*json"
        - "artifacts/legacy/**/*zip"

Lint markdown:
  stage: test
  needs: []
  rules: *rules_always
  image:
    name: davidanson/markdownlint-cli2:v0.20.0
    entrypoint: ["/bin/sh", "-c"]
  script:
    - markdownlint-cli2 "${CI_PROJECT_DIR}/**/*.md"
