Common:
  Target       : DataPort
  ContentType  : Rules
  Version      : 1.0
  Date         : 2024-12-02
  Description  : "Allen-Bradley Logix (EtherNet/IP) – DataPort"
  Author       : "ifm software gmbh"
  MetadataType : YAML

Root:
  Id                       : "AllenBradleyLogixEtherNetIP"
  Name                     : "DataPort Allen-Bradley Logix – EtherNet/IP"
  Description              : "DataPort for Allen-Bradley Logix (ControlLogix/CompactLogix/GuardLogix/SoftLogix) via EtherNet/IP with symbolic tag addressing"
  Icons                    : ['allen-bradley']
  ChildNodes               :
    - Id                   : DEVICE
      MaxDepth             : 64
      MaxInstances         : 32

Nodes:

  # -------------------- DEVICE ------------------------------------------

  - Id                     : DEVICE
    Type                   : DataPortNode
    Name                   : "Device"
    Description            : "Allen-Bradley Logix Device"
    MetadataLength         : 0
    Icons                  : ['device']
    TransferDirections     : [ Outbound, Inbound ]
    ChildNodes             :
      - Id                 : SYSTEM
      - Id                 : MODULES
      - Id                 : CONTROLLER
      - Id                 : PROGRAMS
    PropertyCategories     :
      - Id                 : Connection
        Properties         :
          - Id             : DeviceName
            Required       : true
          - Id             : IpAddress
            Required       : true
          - Id             : Slot
            Required       : true

  # -------------------- SYSTEM (Diagnose) -------------------------------

  - Id                     : SYSTEM
    Type                   : DataPortTreeNode
    Name                   : "System"
    Description            : "System Tags (Diagnostics)"
    Icons                  : ['folder-diagnostic']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_SINT
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_USINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : SCALAR_TIME
      - Id                 : SCALAR_LTIME
      - Id                 : STRUCT
      - Id                 : ARRAY

  # -------------------- MODULES (I/O) -----------------------------------

  - Id                     : MODULES
    Type                   : DataPortTreeNode
    Name                   : "Modules"
    Description            : "Module-defined I/O Tags"
    Icons                  : ['folder-io']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : LOCAL
      - Id                 : REMOTE

  # -------------------- LOCAL -------------------------------------------

  - Id                     : LOCAL
    Type                   : DataPortTreeNode
    Name                   : "Local"
    Description            : "Local I/O Modules"
    Icons                  : ['folder-local']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SLOT

  # -------------------- REMOTE ------------------------------------------

  - Id                     : REMOTE
    Type                   : DataPortTreeNode
    Name                   : "Remote"
    Description            : "Remote I/O Modules"
    Icons                  : ['folder-remote']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : ADAPTER

  # -------------------- ADAPTER -----------------------------------------

  - Id                     : ADAPTER
    Type                   : DataPortTreeNode
    Name                   : "Adapter"
    Description            : "Communication Adapter (from Logix I/O Configuration)"
    Icons                  : ['adapter']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SLOT
      - Id                 : IO_SETS

  # -------------------- SLOT --------------------------------------------

  - Id                     : SLOT
    Type                   : DataPortTreeNode
    Name                   : "Slot"
    Description            : "I/O Slot (0..n)"
    Icons                  : ['slot']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : IO_SETS

  # -------------------- IO_SETS -----------------------------------------

  - Id                     : IO_SETS
    Type                   : DataPortTreeNode
    Name                   : "I/O Data"
    Description            : "I/O Data Sets Container"
    Icons                  : ['folder']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : CONFIG
      - Id                 : INPUT
      - Id                 : OUTPUT

  # -------------------- CONFIG ------------------------------------------

  - Id                     : CONFIG
    Type                   : DataPortTreeNode
    Name                   : "Config"
    Description            : "Configuration Data"
    Icons                  : ['folder-config']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_SINT
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_USINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : STRUCT
      - Id                 : ARRAY

  # -------------------- INPUT -------------------------------------------

  - Id                     : INPUT
    Type                   : DataPortTreeNode
    Name                   : "Input"
    Description            : "Input Data"
    Icons                  : ['folder-input']
    TransferModes          : [ None ]
    TransferDirections     : [ Inbound ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_SINT
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_USINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : STRUCT
      - Id                 : ARRAY

  # -------------------- OUTPUT ------------------------------------------

  - Id                     : OUTPUT
    Type                   : DataPortTreeNode
    Name                   : "Output"
    Description            : "Output Data"
    Icons                  : ['folder-output']
    TransferModes          : [ None ]
    TransferDirections     : [ Outbound ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_SINT
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_USINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : STRUCT
      - Id                 : ARRAY

  # -------------------- CONTROLLER (Tags) -------------------------------

  - Id                     : CONTROLLER
    Type                   : DataPortTreeNode
    Name                   : "Tags"
    Description            : "Controller-Scope Tags"
    Icons                  : ['folder-controller']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_SINT
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_USINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : SCALAR_TIME
      - Id
