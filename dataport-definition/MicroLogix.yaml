    BitRange               : [0, 15]

  - Id                     : FIELD_C_CU
    MappingId              : CounterField
    Type                   : DataPortTreeNode
    Name                   : "CU"
    Description            : "Count Up Bit"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Bool ]

  - Id                     : FIELD_C_CD
    MappingId              : CounterField
    Type                   : DataPortTreeNode
    Name                   : "CD"
    Description            : "Count Down Bit"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Bool ]

  - Id                     : FIELD_C_DN
    MappingId              : CounterField
    Type                   : DataPortTreeNode
    Name                   : "DN"
    Description            : "Done Bit"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Bool ]

  - Id                     : FIELD_C_OV
    MappingId              : CounterField
    Type                   : DataPortTreeNode
    Name                   : "OV"
    Description            : "Overflow Bit"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Bool ]

  - Id                     : FIELD_C_UN
    MappingId              : CounterField
