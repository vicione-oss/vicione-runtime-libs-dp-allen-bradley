PropertyCategories:
  - Id          : Connection
    Name        : "Connection"
    Description : "Device connection properties"

Properties:
  - Id          : DeviceName
    Name        : "Device Name"
    Description : "Name of the Allen-Bradley Legacy device"
    DataType    : String
    UiControl   : TextBox

  - Id          : IpAddress
    Name        : "IP Address"
    Description : "IP address of the device"
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "192.168.1.1"

  - Id          : Slot
    Name        : "Slot"
    Description : "Slot number of the processor"
    DataType    : UInt8
    UiControl   : NumericUpDown
    DefaultValue: 0
    MinValue    : 0
    MaxValue    : 16
