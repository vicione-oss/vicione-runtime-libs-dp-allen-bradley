  - Id                     : FIELD_C_UA
    MappingId              : CounterField
    Type                   : DataPortTreeNode
    Name                   : "UA"
    Description            : "Update Accumulator Bit"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Bool ]

