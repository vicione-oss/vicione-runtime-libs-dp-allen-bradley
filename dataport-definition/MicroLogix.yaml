  - Id                     : FILETYPE_R
    Type                   : DataPortTreeNode
    Name                   : "R (Control)"
    Description            : "Control Files"
    Icons                  : ['folder-control']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : FILENUM_R

  - Id                     : FILENUM_R
    Type                   : DataPortTreeNode
    Name                   : "File Number"
    Description            : "Control File Number"
    Icons                  : ['file']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : ELEMENT_R

  - Id                     : ELEMENT_R
    Type                   : DataPortTreeNode
    Name                   : "Control Element"
    Description            : "Control Structure Instance"
    Icons                  : ['struct-control']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : FIELD_R_LEN
      - Id                 : FIELD_R_POS
      - Id                 : FIELD_R_EN
      - Id                 : FIELD_R_EU
      - Id                 : FIELD_R_DN
      - Id                 : FIELD_R_EM
      - Id                 : FIELD_R_ER
      - Id                 : FIELD_R_UL
      - Id                 : FIELD_R_IN
      - Id                 : FIELD_R_FD

  - Id                     : FIELD_R_LEN
    MappingId              : ControlField
    Type                   : DataPortTreeNode
    Name                   : "LEN"
    Description            : "Length (16-bit)"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Int16 ]

  - Id                     : FIELD_R_POS
    MappingId              : ControlField
