Common:
  Target       : DataPort
  ContentType  : Rules
  Version      : 1.0
  Date         : 2024-12-02
  Description  : "Allen-Bradley Micro800 (EtherNet/IP) – DataPort"
  Author       : "ifm software gmbh"
  MetadataType : YAML

Root:
  Id                       : "AllenBradleyMicro800EtherNetIP"
  Name                     : "DataPort Allen-Bradley Micro800 – EtherNet/IP"
  Description              : "DataPort for Allen-Bradley Micro800 via EtherNet/IP with tag-/symbol-based addressing (Native Tags, no AOIs)"
  Icons                    : ['allen-bradley-micro800']
  ChildNodes               :
    - Id                   : DEVICE
      MaxDepth             : 64
      MaxInstances         : 32

Nodes:

  # -------------------- DEVICE ------------------------------------------

  - Id                     : DEVICE
    Type                   : DataPortNode
    Name                   : "Device"
    Description            : "Allen-Bradley Micro800 Device"
    MetadataLength         : 0
    Icons                  : ['device']
    TransferDirections     : [ Outbound, Inbound ]
    ChildNodes             :
      - Id                 : CONTROLLER
        Required           : true
      - Id                 : PROGRAMS
    PropertyCategories     :
      - Id                 : Connection
        Properties         :
          - Id             : DeviceName
            Required       : true
          - Id             : IpAddress
            Required       : true

  # -------------------- CONTROLLER (Global Tags) ------------------------

  - Id                     : CONTROLLER
    Type                   : DataPortTreeNode
    Name                   : "Tags"
    Description            : "Global Controller-Scope Variables"
    Icons                  : ['folder-controller']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : STRUCT
      - Id                 : ARRAY

  # -------------------- PROGRAMS ----------------------------------------

  - Id                     : PROGRAMS
    Type                   : DataPortTreeNode
    Name                   : "Programs"
    Description            : "Program-Scope Variables"
    Icons                  : ['folder-programs']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : PROGRAM

  # -------------------- PROGRAM -----------------------------------------

  - Id                     : PROGRAM
    Type                   : DataPortTreeNode
    Name                   : "Program"
    Description            : "Program Local Variables"
    Icons                  : ['program']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : STRUCT
      - Id                 : ARRAY

  # -------------------- STRUCT ------------------------------------------

  - Id                     : STRUCT
    Type                   : DataPortTreeNode
    Name                   : "Struct"
    Description            : "UDT/Structure Instance (no AOIs)"
    Icons                  : ['struct']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : STRUCT
      - Id                 : ARRAY

  # -------------------- ARRAY -------------------------------------------

  - Id                     : ARRAY
    Type                   : DataPortTreeNode
    Name                   : "Array"
    Description            : "Array (1..k dimensions)"
    Icons                  : ['array']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : INDEX

  # -------------------- INDEX -------------------------------------------

  - Id                     : INDEX
    Type                   : DataPortTreeNode
    Name                   : "Index"
    Description            : "Array Index (0..N per dimension)"
    Icons                  : ['index']
    TransferModes          : [ None ]
    ChildNodes             :
      - Id                 : SCALAR_BOOL
      - Id                 : SCALAR_INT
      - Id                 : SCALAR_DINT
      - Id                 : SCALAR_LINT
      - Id                 : SCALAR_UINT
      - Id                 : SCALAR_UDINT
      - Id                 : SCALAR_ULINT
      - Id                 : SCALAR_REAL
      - Id                 : SCALAR_LREAL
      - Id                 : SCALAR_STRING
      - Id                 : STRUCT
      - Id                 : ARRAY
      - Id                 : INDEX

  # -------------------- SCALAR TYPES ------------------------------------

  - Id                     : SCALAR_BOOL
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "BOOL"
    Description            : "Boolean scalar value"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Bool ]

  - Id                     : SCALAR_INT
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "INT"
    Description            : "Signed 16-bit integer (Bit access: 0..15, platform-dependent)"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Int16 ]
    BitAccess              : true
    BitRange               : [0, 15]

  - Id                     : SCALAR_DINT
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "DINT"
    Description            : "Signed 32-bit integer (Bit access: 0..31, platform-dependent)"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Int32 ]
    BitAccess              : true
    BitRange               : [0, 31]

  - Id                     : SCALAR_LINT
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "LINT"
    Description            : "Signed 64-bit integer (Bit access: 0..63, platform-dependent)"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Int64 ]
    BitAccess              : true
    BitRange               : [0, 63]

  - Id                     : SCALAR_UINT
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "UINT"
    Description            : "Unsigned 16-bit integer (Bit access: 0..15, platform-dependent)"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ UInt16 ]
    BitAccess              : true
    BitRange               : [0, 15]

  - Id                     : SCALAR_UDINT
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "UDINT"
    Description            : "Unsigned 32-bit integer (Bit access: 0..31, platform-dependent)"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ UInt32 ]
    BitAccess              : true
    BitRange               : [0, 31]

  - Id                     : SCALAR_ULINT
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "ULINT"
    Description            : "Unsigned 64-bit integer (Bit access: 0..63, platform-dependent)"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ UInt64 ]
    BitAccess              : true
    BitRange               : [0, 63]

  - Id                     : SCALAR_REAL
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "REAL"
    Description            : "32-bit floating point"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Float32 ]

  - Id                     : SCALAR_LREAL
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "LREAL"
    Description            : "64-bit floating point"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ Float64 ]

  - Id                     : SCALAR_STRING
    MappingId              : Tag
    Type                   : DataPortTreeNode
    Name                   : "STRING"
    Description            : "String value"
    Icons                  : ['datapoint']
    TransferModes          : [ OnChange, Periodic, None ]
    DataTypes              : [ String ]

PropertyCategories:
  - Id          : Connection
    Name        : "Connection"
    Description : "Device connection properties"

Properties:
  - Id          : DeviceName
    Name        : "Device Name"
    Description : "Name of the Allen-Bradley Micro800 device"
    DataType    : String
    UiControl   : TextBox

  - Id          : IpAddress
    Name        : "IP Address"
    Description : "IP address of the device"
    DataType    : String
    UiControl   : TextBox
    DefaultValue: "192.168.1.1"
